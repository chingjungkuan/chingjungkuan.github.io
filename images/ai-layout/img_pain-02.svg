<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 單頁：固定版型對上多變照片，主體被裁掉 -->

  <!-- 左：固定版型 -->
  <rect x="20" y="44" width="100" height="112" rx="8" fill="#FFFFFF" stroke="#B9A6C4" stroke-width="3"/>
  <rect x="32" y="58" width="34" height="30" rx="4" fill="#F1EAF4" stroke="#C3B0CE" stroke-width="2.5"/>
  <rect x="74" y="58" width="34" height="30" rx="4" fill="#F1EAF4" stroke="#C3B0CE" stroke-width="2.5"/>
  <rect x="32" y="98" width="76" height="44" rx="4" fill="#F1EAF4" stroke="#C3B0CE" stroke-width="2.5"/>

  <!-- 中：衝突 -->
  <path d="M138 90 L158 110 M158 90 L138 110" stroke="#8B6A9C" stroke-width="4" stroke-linecap="round"/>

  <!-- 右：直式照片的完整範圍（被裁掉的部分） -->
  <rect x="206" y="26" width="62" height="148" rx="6" stroke="#CBBAD5" stroke-width="2.5" stroke-dasharray="6 7" fill="none"/>
  <circle cx="237" cy="54" r="13" stroke="#CBBAD5" stroke-width="2.5" fill="none"/>
  <path d="M214 86 C216 70 226 66 237 66 C248 66 258 70 260 86" stroke="#CBBAD5" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- 框內實際看得到的部分 -->
  <rect x="206" y="78" width="62" height="62" fill="#F1EAF4"/>
  <path d="M214 86 C216 74 226 70 237 70 C248 70 258 74 260 86" stroke="#8B6A9C" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 固定的橫式框 -->
  <rect x="180" y="78" width="110" height="62" rx="6" stroke="#8B6A9C" stroke-width="3.5" fill="none"/>
</svg>
